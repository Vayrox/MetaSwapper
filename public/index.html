<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetaSwapper – iPhone 16 Pro</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: #2a2a3a;
      --accent: #6c5ce7;
      --accent2: #a29bfe;
      --green: #00b894;
      --red: #ff6b6b;
      --orange: #fdcb6e;
      --text: #e0e0e8;
      --text2: #8888a0;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text2);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface);
      position: relative;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(108, 92, 231, 0.05);
    }
    .upload-zone h2 { font-size: 18px; margin-bottom: 8px; }
    .upload-zone p { color: var(--text2); font-size: 14px; }
    .upload-zone input { display: none; }
    .upload-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 28px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .upload-btn:hover { background: #5a4bd1; }

    /* Section titles */
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin: 32px 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .count {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text2);
    }

    /* Queue list */
    .queue { display: flex; flex-direction: column; gap: 8px; }
    .queue-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: border-color 0.2s;
    }
    .queue-item:hover { border-color: var(--accent); }
    .queue-item .info { flex: 1; min-width: 0; }
    .queue-item .name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-item .time { font-size: 12px; color: var(--text2); margin-top: 2px; }

    /* Status badges */
    .status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .status.queued { background: rgba(253,203,110,0.15); color: var(--orange); }
    .status.processing { background: rgba(108,92,231,0.15); color: var(--accent2); }
    .status.done { background: rgba(0,184,148,0.15); color: var(--green); }
    .status.error { background: rgba(255,107,107,0.15); color: var(--red); }

    /* Action buttons */
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent2); }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover { background: #5a4bd1; }
    .btn.danger:hover { border-color: var(--red); color: var(--red); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 { font-size: 16px; }
    .modal-close {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }

    /* Metadata comparison */
    .meta-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      background: var(--surface2);
      border-radius: 8px;
      padding: 4px;
    }
    .meta-tab {
      flex: 1;
      padding: 8px 16px;
      text-align: center;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .meta-tab.active {
      background: var(--accent);
      color: #fff;
    }
    .meta-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .meta-table th,
    .meta-table td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .meta-table th {
      color: var(--text2);
      font-weight: 500;
      width: 35%;
      position: sticky;
      top: 0;
      background: var(--surface);
    }
    .meta-table td { word-break: break-all; }
    .meta-table tr:hover td { background: var(--surface2); }

    .diff-row td:first-child { color: var(--accent2); font-weight: 600; }

    .meta-side-by-side {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .meta-panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .meta-panel-header {
      padding: 10px 14px;
      background: var(--surface2);
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    .meta-panel-header.original { color: var(--red); }
    .meta-panel-header.swapped { color: var(--green); }
    .meta-panel-body {
      max-height: 400px;
      overflow-y: auto;
    }

    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--text2);
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .meta-side-by-side { grid-template-columns: 1fr; }
      .queue-item { flex-wrap: wrap; }
      .actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>MetaSwapper</h1>
  <span class="badge">iPhone 16 Pro</span>
</div>

<div class="container">
  <!-- Upload -->
  <div class="upload-zone" id="dropZone">
    <h2>Drop photos here</h2>
    <p>or click to browse &middot; JPG, PNG, HEIC, TIFF, WebP &middot; up to 50MB each</p>
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Select Files</button>
    <input type="file" id="fileInput" multiple accept="image/*" />
  </div>

  <!-- Queue -->
  <div class="section-title">
    Queue <span class="count" id="queueCount">0</span>
  </div>
  <div class="queue" id="queueList">
    <div class="empty-state" id="emptyState">No photos in queue. Upload some to get started.</div>
  </div>
</div>

<!-- Metadata Modal -->
<div class="modal-overlay" id="metaModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Metadata Viewer</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="meta-tabs">
        <button class="meta-tab active" data-tab="sideBySide">Side by Side</button>
        <button class="meta-tab" data-tab="original">Original Only</button>
        <button class="meta-tab" data-tab="swapped">Swapped Only</button>
      </div>
      <div id="metaContent"></div>
    </div>
  </div>
</div>

<script>
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const queueList = document.getElementById("queueList");
const queueCount = document.getElementById("queueCount");
const emptyState = document.getElementById("emptyState");
const metaModal = document.getElementById("metaModal");
const modalTitle = document.getElementById("modalTitle");
const metaContent = document.getElementById("metaContent");

let allJobs = [];
let pollTimer = null;

// Drag & drop
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files.length) uploadFiles(fileInput.files);
  fileInput.value = "";
});

async function uploadFiles(files) {
  const fd = new FormData();
  for (const f of files) fd.append("photos", f);
  try {
    const res = await fetch("/api/upload", { method: "POST", body: fd });
    if (!res.ok) throw new Error(await res.text());
    startPolling();
  } catch (err) {
    alert("Upload failed: " + err.message);
  }
}

function startPolling() {
  if (pollTimer) return;
  refreshQueue();
  pollTimer = setInterval(refreshQueue, 1500);
}

async function refreshQueue() {
  try {
    const res = await fetch("/api/queue");
    const data = await res.json();
    allJobs = data.jobs;
    renderQueue();

    // Stop polling if nothing is in progress
    const active = allJobs.some((j) => j.status === "queued" || j.status === "processing");
    if (!active && pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  } catch (e) { /* ignore transient errors */ }
}

function renderQueue() {
  queueCount.textContent = allJobs.length;
  if (allJobs.length === 0) {
    queueList.innerHTML = '';
    queueList.appendChild(emptyState);
    return;
  }

  queueList.innerHTML = allJobs.map((j) => `
    <div class="queue-item">
      <div class="info">
        <div class="name">${esc(j.originalName)}</div>
        <div class="time">${timeAgo(j.uploadedAt)}</div>
      </div>
      <span class="status ${j.status}">${j.status}</span>
      <div class="actions">
        ${j.status === "done" ? `
          <button class="btn" onclick="viewMeta('${j.id}')">Metadata</button>
          <button class="btn primary" onclick="download('${j.id}')">Download</button>
        ` : ""}
        <button class="btn danger" onclick="deleteJob('${j.id}')">&times;</button>
      </div>
    </div>
  `).join("");
}

async function download(id) {
  window.open(`/api/download/${encodeURIComponent(id)}`, "_blank");
}

async function deleteJob(id) {
  await fetch(`/api/job/${encodeURIComponent(id)}`, { method: "DELETE" });
  refreshQueue();
}

// Metadata viewer
let currentMeta = { original: null, swapped: null };

async function viewMeta(id) {
  const res = await fetch(`/api/job/${encodeURIComponent(id)}`);
  const job = await res.json();
  currentMeta.original = job.originalMeta || {};
  currentMeta.swapped = job.newMeta || {};
  modalTitle.textContent = `Metadata – ${job.originalName}`;
  renderMetaTab("sideBySide");
  metaModal.classList.add("open");
}

function closeModal() {
  metaModal.classList.remove("open");
}
metaModal.addEventListener("click", (e) => { if (e.target === metaModal) closeModal(); });

// Tab clicks
document.querySelectorAll(".meta-tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".meta-tab").forEach((t) => t.classList.remove("active"));
    tab.classList.add("active");
    renderMetaTab(tab.dataset.tab);
  });
});

function renderMetaTab(tab) {
  if (tab === "sideBySide") {
    const allKeys = [...new Set([
      ...Object.keys(currentMeta.original),
      ...Object.keys(currentMeta.swapped),
    ])].sort();

    metaContent.innerHTML = `
      <div class="meta-side-by-side">
        <div class="meta-panel">
          <div class="meta-panel-header original">Original Metadata</div>
          <div class="meta-panel-body">
            <table class="meta-table">
              ${allKeys.map((k) => `<tr class="${currentMeta.original[k] !== currentMeta.swapped[k] ? 'diff-row' : ''}">
                <th>${esc(k)}</th><td>${esc(fmt(currentMeta.original[k]))}</td>
              </tr>`).join("")}
            </table>
          </div>
        </div>
        <div class="meta-panel">
          <div class="meta-panel-header swapped">Swapped Metadata (iPhone 16 Pro)</div>
          <div class="meta-panel-body">
            <table class="meta-table">
              ${allKeys.map((k) => `<tr class="${currentMeta.original[k] !== currentMeta.swapped[k] ? 'diff-row' : ''}">
                <th>${esc(k)}</th><td>${esc(fmt(currentMeta.swapped[k]))}</td>
              </tr>`).join("")}
            </table>
          </div>
        </div>
      </div>`;
  } else {
    const data = tab === "original" ? currentMeta.original : currentMeta.swapped;
    const label = tab === "original" ? "Original" : "Swapped (iPhone 16 Pro)";
    metaContent.innerHTML = `
      <table class="meta-table">
        <tr><th colspan="2" style="color:var(--accent2)">${label}</th></tr>
        ${Object.entries(data).sort(([a],[b]) => a.localeCompare(b)).map(([k, v]) =>
          `<tr><th>${esc(k)}</th><td>${esc(fmt(v))}</td></tr>`
        ).join("")}
      </table>`;
  }
}

function fmt(v) {
  if (v === undefined || v === null) return "—";
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

// Initial load
startPolling();
</script>

</body>
</html>
